{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 450px; width: 100%;">
        <div style="text-align: center; margin-bottom: var(--spacing-xl);">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: rgba(5, 150, 105, 0.1); border-radius: 16px; margin-bottom: var(--spacing-md);">
                <i data-lucide="zap" width="32" height="32" style="color: var(--primary);"></i>
            </div>
            <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-primary); margin-bottom: var(--spacing-xs);">Welcome Back</h1>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">Smart Utility Management System</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="username" 
                    required
                    autofocus
                    placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password" 
                    required
                    placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.875rem;">
                <i data-lucide="log-in" width="18" height="18"></i>
                Sign In
            </button>
        </form>
        
        <div style="margin-top: var(--spacing-xl); padding-top: var(--spacing-lg); border-top: 1px solid var(--border); text-align: center;">
            <p style="font-size: 0.875rem; color: var(--text-secondary);">
                Demo Credentials: <span style="font-family: monospace; color: var(--text-primary); font-weight: 500;">manager1 / password123</span>
            </p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    lucide.createIcons();
});
</script>
{% endblock %}

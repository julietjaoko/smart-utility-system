{% extends 'core/base.html' %}
{% block title %}System Admin - Add Unit{% endblock %}

{% block content %}
<div class="card" style="max-width: 760px;">
    <div class="card-header">
        <h1 class="card-title">
            <i data-lucide="home" width="28"></i>
            Add New Unit
        </h1>
    </div>

    <form method="POST" action="{% url 'system_admin_add_unit' %}">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color: var(--error);">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i data-lucide="check" width="16"></i>
                Save & Assign Unit
            </button>
            <button type="button" onclick="if(window.closeModal) { closeModal(); } else { window.location.href='{% url 'system_admin_manage_units' %}'; }" class="btn btn-secondary">
                Cancel
            </button>
        </div>
    </form>
</div>
{% endblock %}

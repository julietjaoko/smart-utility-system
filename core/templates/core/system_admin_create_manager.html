{% extends 'core/base.html' %}
{% block title %}Create Property Manager{% endblock %}

{% block content %}
<div class="card" style="max-width: 760px;">
    <div class="card-header">
        <h1 class="card-title">
            <i data-lucide="user-plus"></i>
            Create Property Manager
        </h1>
    </div>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color: var(--error);">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i data-lucide="check" width="16"></i>
                Create Manager
            </button>
            <a href="{% url 'system_admin_managers' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
